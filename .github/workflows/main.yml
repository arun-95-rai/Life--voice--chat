name: Build Life Voice Chat

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: codespace-bug-free-tribble-gxrxx6rig9vcwx5v

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: life-app
        run: npm ci

      - name: Build app
        working-directory: life-app
        run: npm run build
      - name: Build Android APK
        working-directory: life-app
        run: |
          npm install @capacitor/android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeVoiceChat-APK
          path: life-app/android/app/build/outputs/apk/debug/app-debug.apk
