name: Build Life Voice Chat

on:
  push:
    branches:
      - codespace-bug-free-tribble-gxrxx6rig9vcwx5v
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: life-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: life-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
