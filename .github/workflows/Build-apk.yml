name: Build Life Voice Chat APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: codespace-bug-free-tribble-gxrxx6rig9vcwx5v

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: life-app
        run: npm ci

      - name: Build web app
        working-directory: life-app
        run: npm run build

      - name: Prepare Android project
        working-directory: life-app
        run: npx cap sync android

      - name: Build APK and show fingerprints
        working-directory: life-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          echo "=== DEBUG CERTIFICATE FINGERPRINTS ==="
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Life-Voice-Chat-APK
          path: life-app/android/app/build/outputs/apk/debug/app-debug.apk
